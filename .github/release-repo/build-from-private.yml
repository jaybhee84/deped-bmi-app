name: Build Release from private source

# Lives in the PUBLIC release repo (buzzjay84/deped-bmi-app) as
# .github/workflows/build-from-private.yml. A copy is kept in the private
# source at .github/release-repo/build-from-private.yml. (Same setup as Tax-E.)
# Actions on a public repository are free, so the installers are built here.
# The private source (jaybhee84/deped-bmi-app) is checked out read-only with a
# deploy key, linted, built, and the installers are published to THIS repo's
# Releases, where installed apps look for updates (package.json build.publish).
#
# Started by watch-private.yml when the private source's version changes, or
# by hand:
#   gh workflow run build-from-private.yml -R buzzjay84/deped-bmi-app -f tag=v3.0.9 -f ref=main
#
# One tag, one release: create-release makes a single draft release with the
# notes from src/data/releaseNotes.js; the Windows, macOS Intel and macOS Apple
# Silicon builds run in parallel and each uploads its own files into it;
# publish-release checks the updater files and makes it public only after all
# builds succeed.
#
# macOS: each architecture is built on its own runner from a fresh checkout,
# so the SQLite driver (better-sqlite3, a native module) is never shared
# between architectures. Before upload, `lipo` must show the Electron
# executable and better_sqlite3.node built for the expected architecture.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish, e.g. v3.0.9 (must equal package.json version at ref)'
        required: true
        type: string
      ref:
        description: 'Branch, tag or commit of the private source to build (default: main)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: jaybhee84/deped-bmi-app
  RELEASE_TAG: ${{ github.event.inputs.tag }}
  SOURCE_REF: ${{ github.event.inputs.ref || 'main' }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like vX.Y.Z
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v3.0.9" >&2
            exit 1
          fi

      # Read-only deploy key for the private repo. The key is never printed and no credentials are
      # left in the workspace. Logs of a public repo are public, so nothing here echoes source.
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create the one draft release all builds upload into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG must match package.json version $VERSION." >&2
            exit 1
          fi
          # Release notes come from src/data/releaseNotes.js (fails if missing).
          node scripts/generate-release-body.mjs "$VERSION"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$RELEASE_TAG is already published; bump the version for a new release." >&2
            exit 1
          elif gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file RELEASE_BODY.md
            echo "Draft release $RELEASE_TAG exists; the builds will upload into it."
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --draft --title "$RELEASE_TAG" --notes-file RELEASE_BODY.md
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/*.exe release/*.exe.blockmap release/latest.yml --repo "${{ github.repository }}" --clobber

  build-macos:
    needs: create-release
    strategy:
      fail-fast: true
      matrix:
        include:
          # Apple Silicon: built natively on an arm64 runner.
          - arch: arm64
            runner: macos-latest
            lipo: arm64
          # Intel: built natively on an Intel runner, so npm ci, the native
          # module rebuild and Electron are all x86_64.
          - arch: x64
            runner: macos-15-intel
            lipo: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          # No npm cache: nothing native is carried over between architectures.

      # Fresh node_modules on this runner only.
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Rebuild the SQLite driver for Electron (the version in package.json)
      # and THIS architecture.
      - name: Rebuild native modules for Electron ${{ matrix.arch }}
        run: npx electron-builder install-app-deps --platform=darwin --arch=${{ matrix.arch }}

      # No Apple certificate: unsigned DMG (right-click > Open the first time).
      - name: Build the ${{ matrix.arch }} DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Electron and better_sqlite3.node must both be ${{ matrix.lipo }}
        shell: bash
        run: |
          # package.json lists both architectures, so electron-builder packages
          # both here: x64 goes to release/mac, arm64 to release/mac-arm64.
          # Check the one this job uploads.
          APP="release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/DepEd BMI App.app"
          EXE="$APP/Contents/MacOS/DepEd BMI App"
          NODE="$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          file "$EXE" "$NODE"
          EXE_ARCH=$(lipo -archs "$EXE"); NODE_ARCH=$(lipo -archs "$NODE")
          echo "Electron: $EXE_ARCH   better_sqlite3.node: $NODE_ARCH   expected: ${{ matrix.lipo }}"
          if [ "$EXE_ARCH" != "${{ matrix.lipo }}" ] || [ "$NODE_ARCH" != "${{ matrix.lipo }}" ]; then
            echo "::error::Architecture mismatch in the ${{ matrix.arch }} app (Electron $EXE_ARCH, better_sqlite3.node $NODE_ARCH, expected ${{ matrix.lipo }}). Not publishing." >&2
            exit 1
          fi

      # Each job writes latest-mac.yml for its own build; publish-release
      # merges the two so the update check sees both.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp release/latest-mac.yml "release/latest-mac-${{ matrix.arch }}.yml"
          gh release upload "$RELEASE_TAG" release/*-mac-${{ matrix.arch }}.dmg release/*-mac-${{ matrix.arch }}.dmg.blockmap \
            release/*-mac-${{ matrix.arch }}.zip release/*-mac-${{ matrix.arch }}.zip.blockmap \
            "release/latest-mac-${{ matrix.arch }}.yml" --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Check out private source (release scripts)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Merge the macOS update files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern 'latest-mac-*.yml' --dir mac
          # Insert the arm64 entries into the x64 file's list of files.
          node -e '
            const fs = require("fs");
            const x64 = fs.readFileSync("mac/latest-mac-x64.yml", "utf8"), arm = fs.readFileSync("mac/latest-mac-arm64.yml", "utf8");
            const NL = String.fromCharCode(10);
            const entries = s => s.slice(s.indexOf("files:" + NL) + 7, s.indexOf(NL + "path:")).trimEnd();
            fs.writeFileSync("mac/latest-mac.yml", x64.replace(NL + "path:", NL + entries(arm) + NL + "path:"));
          '
          cat mac/latest-mac.yml
          gh release upload "$RELEASE_TAG" mac/latest-mac.yml --repo "${{ github.repository }}" --clobber
          gh release delete-asset "$RELEASE_TAG" latest-mac-x64.yml --repo "${{ github.repository }}" --yes
          gh release delete-asset "$RELEASE_TAG" latest-mac-arm64.yml --repo "${{ github.repository }}" --yes

      - name: Every file the updater metadata names must be in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --dir assets
          node scripts/validate-release-assets.mjs assets

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
