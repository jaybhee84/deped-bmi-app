name: Build and Release
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build Windows packages
        run: npx electron-builder --win --publish never
      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Build macOS packages
        run: npx electron-builder --mac --publish never
      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Generate Release Notes Body
        run: node scripts/generate-release-body.mjs ${{ steps.version.outputs.version }}
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Validate updater metadata
        run: node scripts/validate-release-assets.mjs release
      - name: Create GitHub release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: RELEASE_BODY.md
          files: release/*
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
